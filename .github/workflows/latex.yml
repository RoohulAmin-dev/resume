name: Build Resume PDF

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume.pdf